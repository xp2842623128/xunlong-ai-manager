    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><img src="/logo.png" alt="迅龙AI管家" /></div>
        <div>
          <div class="brand-name">迅龙AI管家</div>
        </div>
      </div>

      <div class="side-label">通用功能</div>
      <nav class="nav" id="nav">
        <a class="nav-item" href="#/dashboard" data-route="dashboard"><svg><use href="#i-chart"/></svg>工作台</a>
        <a class="nav-item" href="#/store" data-route="store"><svg><use href="#i-dashboard"/></svg>AI 商店</a>
        <a class="nav-item" href="#/providers" data-route="providers"><svg><use href="#i-server"/></svg>模型管理<span class="cbadge" id="nav-providers"></span></a>

        <a class="nav-item" href="#/mcp" data-route="mcp"><svg><use href="#i-plug"/></svg>MCP</a>

        <a class="nav-item" href="#/prompts" data-route="prompts"><svg><use href="#i-prompt"/></svg>提示词</a>
        <a class="nav-item" href="#/sessions" data-route="sessions"><svg><use href="#i-clock"/></svg>会话</a>
        <a class="nav-item" href="#/usage" data-route="usage"><svg><use href="#i-chart"/></svg>Token 用量</a>
      </nav>

      <div class="side-card" id="side-gateway">
        <div class="t"><svg><use href="#i-route"/></svg>本地聚合网关<span class="pill-free">免费</span></div>
        <div class="s"><span class="dot off" id="side-gw-dot"></span><span id="side-gw-text">未启动</span></div>
      </div>      <div class="side-card" id="side-accel">
        <div class="t"><svg><use href="#i-globe"/></svg>AI 通用加速<span class="pill-free">免费</span></div>
        <div class="s"><span class="dot on"></span><span>国内镜像</span></div>
      </div>

      <div class="side-label">我的应用</div>
      <div class="side-apps" id="side-apps"></div>

      <div class="sidebar-foot">
        <div>本地优先 · Key 只存在本机</div>
        <div>v<span id="app-version">1.0.0</span> · MIT · 无账号无会员</div>
      </div>
    </aside>

    <main class="main">
      <div class="topstrip">
        <div class="spacer"></div>
        <button class="icon-btn" id="btn-menu" title="菜单"><svg width="18" height="18"><use href="#i-menu"/></svg></button>
        <div class="global-menu" id="global-menu">
          <button data-gm="update"><svg width="15" height="15"><use href="#i-refresh"/></svg>版本信息</button>
          <button data-gm="diag"><svg width="15" height="15"><use href="#i-download"/></svg>导出诊断包</button>
          <div class="sep"></div>
          <button data-gm="dashboard">工作台</button>
          <button data-gm="providers">模型管理</button>
          <button data-gm="skills">Skills</button>
          <button data-gm="mcp">MCP</button>
          <button data-gm="market">插件市场</button>
          <button data-gm="prompts">提示词</button>
          <button data-gm="sessions">会话</button>
          <button data-gm="usage">Token 用量</button>
          <div class="sep"></div>
          <button data-gm="settings"><svg width="15" height="15"><use href="#i-settings"/></svg>设置</button>
        </div>
      </div>
      <div class="content" id="view"><div class="skeleton">加载中…</div></div>
    </main>
  </div>

  <div class="modal-mask" id="modal-mask">
    <div class="modal" id="modal">
      <div class="modal-head">
        <div class="modal-title" id="modal-title">标题</div>
        <button class="icon-btn" data-close><svg width="18" height="18"><use href="#i-x"/></svg></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-foot" id="modal-foot"></div>
    </div>
  </div>

  <div class="drawer-mask" id="drawer-mask"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <div class="modal-title" id="drawer-title">会话详情</div>
      <button class="icon-btn" data-drawer-close><svg width="18" height="18"><use href="#i-x"/></svg></button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <div class="toasts" id="toasts"></div>

  <script type="module" src="/app.js"></script>
